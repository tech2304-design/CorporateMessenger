name: CI (Android + Python)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    name: Android build (Gradle, Java 17)
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin) and cache Gradle
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Cache Gradle and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Install Android SDK command-line tools and required packages
        run: |
          set -e
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT
          # download CLI tools (will fallback if previously cached on runner)
          CLI_ZIP="commandlinetools-linux.zip"
          if [ ! -f "$CLI_ZIP" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -O $CLI_ZIP
          fi
          unzip -q $CLI_ZIP -d cmdline-tools-temp
          mkdir -p cmdline-tools/latest
          mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/ || true
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.2" "tools" || true
        shell: bash

      - name: Accept Android licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT || true
        shell: bash

      - name: Build (Gradle) — assembleDebug
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload build artifact (APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/**/*.apk

  python:
    name: Python checks
    runs-on: ubuntu-latest
    needs: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install requirements (if present)
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          fi

      - name: Run linters / tests (adjust commands if project differs)
        run: |
          if command -v pytest >/dev/null 2>&1 && [ -d tests ]; then
            pytest -q
          fi
          if command -v flake8 >/dev/null 2>&1; then
            flake8 || true
          fi
